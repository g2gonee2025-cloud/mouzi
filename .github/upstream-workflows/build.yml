name: Build and release

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Re-test existing Windows artifacts without rebuilding
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  windows:
    if: ${{ !inputs.artifact_run_id }}
    name: Build Windows (unsigned Authenticode)
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers and updater signatures
        run: npm run tauri build -- --ci

      - name: Test Rust and rule helpers
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          npm test

      - name: Test the Windows release executable
        shell: pwsh
        run: |
          $runtimeInstaller = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $runtimeInstaller
          $signature = Get-AuthenticodeSignature -LiteralPath $runtimeInstaller
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid WebView2 installer signature' }
          $runtimeInstall = Start-Process -FilePath $runtimeInstaller -ArgumentList '/silent','/install' -Wait -PassThru -WindowStyle Hidden
          Write-Host "WebView2 setup exit: $($runtimeInstall.ExitCode)"
          npm install --no-save --package-lock=false playwright
          $env:MOUZI_TEST_EXE = 'src-tauri/target/release/mouzi.exe'
          $env:MOUZI_TEST_VERSION = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          node tests/private-beta-ui.mjs

      - name: Upload Windows test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-evidence
          path: artifacts/*/private-tests/

      - name: Collect Windows artifacts
        if: always()
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item release-windows -ItemType Directory
          Copy-Item src-tauri/target/release/mouzi.exe "release-windows/Mouzi_${version}_x64-portable.exe"
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-windows/
          Copy-Item src-tauri/target/release/bundle/nsis/*.sig release-windows/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-windows/
          Get-ChildItem src-tauri/target/release/bundle/msi/*.sig -ErrorAction SilentlyContinue | Copy-Item -Destination release-windows/

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-windows/*
          if-no-files-found: error

  linux:
    if: ${{ !inputs.artifact_run_id }}
    name: Build and validate Linux
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xauth xvfb libfuse2 weston xwayland imagemagick tesseract-ocr

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run tauri build -- --ci

      - name: Test Rust on Linux
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Test translations and rule helpers
        run: npm test

      - name: Repair and re-sign AppImage
        shell: bash
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$APPIMAGE"
          bash .github/scripts/fix-appimage-symlinks.sh "$APPIMAGE"
          rm -f "$APPIMAGE.sig"
          npm run tauri signer sign -- "$APPIMAGE"
          test -s "$APPIMAGE.sig"
          echo "APPIMAGE_PATH=$APPIMAGE" >> "$GITHUB_ENV"

      - name: Ensure DEB and RPM updater signatures
        shell: bash
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          RPM=$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)
          test -n "$DEB"
          test -n "$RPM"
          if [[ ! -s "$DEB.sig" ]]; then
            npm run tauri signer sign -- "$DEB"
          fi
          rm -f "$RPM.sig"
          npm run tauri signer sign -- "$RPM"
          test -s "$DEB.sig"
          test -s "$RPM.sig"

      - name: Render Settings under Wayland and XWayland
        run: xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- bash .github/scripts/test-linux-ui.sh "$APPIMAGE_PATH" linux-test-evidence

      - name: Upload Linux test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-evidence
          path: linux-test-evidence/

      - name: Install AppImage with AppManager 3.7.3
        shell: bash
        run: |
          curl -fsSL \
            https://github.com/kem-a/AppManager/releases/download/v3.7.3/AppManager-3.7.3-anylinux-x86_64.AppImage \
            -o "$RUNNER_TEMP/AppManager.AppImage"
          chmod +x "$RUNNER_TEMP/AppManager.AppImage"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/appmanager-home/.config"
          export XDG_DATA_HOME="$RUNNER_TEMP/appmanager-home/.local/share"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          cp "$APPIMAGE_PATH" "$RUNNER_TEMP/Mouzi-AppManager-test.AppImage"
          xvfb-run -a "$RUNNER_TEMP/AppManager.AppImage" install "$RUNNER_TEMP/Mouzi-AppManager-test.AppImage"

      - name: Collect Linux artifacts
        shell: bash
        run: |
          mkdir release-linux
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-linux/
          cp src-tauri/target/release/bundle/appimage/*.sig release-linux/
          cp src-tauri/target/release/bundle/deb/*.deb release-linux/
          cp src-tauri/target/release/bundle/deb/*.sig release-linux/
          cp src-tauri/target/release/bundle/rpm/*.rpm release-linux/
          cp src-tauri/target/release/bundle/rpm/*.sig release-linux/

      - name: Upload validated Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-linux/*
          if-no-files-found: error

  windows-smoke:
    if: ${{ inputs.artifact_run_id != '' && github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-windows
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare WebView2 and run UI tests
        shell: pwsh
        run: |
          $runtimeInstaller = Join-Path $env:RUNNER_TEMP 'WebView2.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $runtimeInstaller
          $signature = Get-AuthenticodeSignature -LiteralPath $runtimeInstaller
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid WebView2 installer signature' }
          Start-Process -FilePath $runtimeInstaller -ArgumentList '/silent','/install' -Wait -WindowStyle Hidden
          $runtimePath = Get-ChildItem "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application" -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'msedgewebview2.exe') } | Sort-Object Name -Descending | Select-Object -First 1
          if ($runtimePath) { $env:WEBVIEW2_BROWSER_EXECUTABLE_FOLDER = $runtimePath.FullName; Write-Host "WebView2: $($runtimePath.FullName)" }
          npm install --no-save --package-lock=false playwright
          $env:MOUZI_TEST_EXE = (Get-ChildItem release-windows/*portable.exe).FullName
          $env:MOUZI_TEST_VERSION = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          node tests/private-beta-ui.mjs
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-retest-evidence
          path: artifacts/*/private-tests/

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create updater manifest and checksums
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NSIS_PATH=$(find release -maxdepth 1 -name '*-setup.exe' -print -quit)
          MSI_PATH=$(find release -maxdepth 1 -name '*.msi' -print -quit)
          APPIMAGE_PATH=$(find release -maxdepth 1 -name '*.AppImage' -print -quit)
          DEB_PATH=$(find release -maxdepth 1 -name '*.deb' -print -quit)
          RPM_PATH=$(find release -maxdepth 1 -name '*.rpm' -print -quit)
          test -n "$NSIS_PATH"
          test -n "$MSI_PATH"
          test -n "$APPIMAGE_PATH"
          test -n "$DEB_PATH"
          test -n "$RPM_PATH"
          test -s "$NSIS_PATH.sig"
          test -s "$MSI_PATH.sig"
          test -s "$APPIMAGE_PATH.sig"
          test -s "$DEB_PATH.sig"
          test -s "$RPM_PATH.sig"

          NSIS_NAME=$(basename "$NSIS_PATH")
          MSI_NAME=$(basename "$MSI_PATH")
          APPIMAGE_NAME=$(basename "$APPIMAGE_PATH")
          DEB_NAME=$(basename "$DEB_PATH")
          RPM_NAME=$(basename "$RPM_PATH")
          NSIS_SIGNATURE=$(cat "$NSIS_PATH.sig")
          MSI_SIGNATURE=$(cat "$MSI_PATH.sig")
          APPIMAGE_SIGNATURE=$(cat "$APPIMAGE_PATH.sig")
          DEB_SIGNATURE=$(cat "$DEB_PATH.sig")
          RPM_SIGNATURE=$(cat "$RPM_PATH.sig")
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          jq -n \
            --arg version "$VERSION" \
            --arg notes "See the Mouzi ${GITHUB_REF_NAME} release notes on GitHub." \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg windows_url "$BASE_URL/$NSIS_NAME" \
            --arg windows_signature "$NSIS_SIGNATURE" \
            --arg msi_url "$BASE_URL/$MSI_NAME" \
            --arg msi_signature "$MSI_SIGNATURE" \
            --arg linux_url "$BASE_URL/$APPIMAGE_NAME" \
            --arg linux_signature "$APPIMAGE_SIGNATURE" \
            --arg deb_url "$BASE_URL/$DEB_NAME" \
            --arg deb_signature "$DEB_SIGNATURE" \
            --arg rpm_url "$BASE_URL/$RPM_NAME" \
            --arg rpm_signature "$RPM_SIGNATURE" \
            '{version:$version, notes:$notes, pub_date:$pub_date, platforms:{"windows-x86_64":{signature:$windows_signature,url:$windows_url},"windows-x86_64-nsis":{signature:$windows_signature,url:$windows_url},"windows-x86_64-msi":{signature:$msi_signature,url:$msi_url},"linux-x86_64":{signature:$linux_signature,url:$linux_url},"linux-x86_64-appimage":{signature:$linux_signature,url:$linux_url},"linux-x86_64-deb":{signature:$deb_signature,url:$deb_url},"linux-x86_64-rpm":{signature:$rpm_signature,url:$rpm_url}}}' \
            > release/latest.json

          (
            cd release
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum \
              > SHA256SUMS.txt
          )

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Mouzi $GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Mouzi $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
