name: Translation checks

on:
  push:
    branches: [main]
    paths:
      - 'src/i18n/**'
      - 'tests/i18n.test.mjs'
      - 'package*.json'
      - '.github/workflows/translations.yml'
  pull_request:
    paths:
      - 'src/i18n/**'
      - 'tests/i18n.test.mjs'
      - 'package*.json'
      - '.github/workflows/translations.yml'

permissions:
  contents: read

jobs:
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:release-contracts
