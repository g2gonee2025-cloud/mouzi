# Build check for this fork. Deliberately narrow:
#   - Windows only: the only platform this fork targets.
#   - Unsigned, no installers published, no updater, no store distribution.
#   - No `secrets.*` reference of any kind, and read-only token permissions.
#   - No `tags:` trigger, so a `git push --tags` can never start a release.
#
# Upstream (hsr88/mouzi) shipped five workflows here. Two of them signed
# binaries through SignPath using secrets.SIGNPATH_API_TOKEN and published
# GitHub Releases named after the upstream product ("Mouzi <tag>") when a
# version tag was pushed. This fork keeps the upstream product name and the
# upstream app identifier (cc.mouzi.app) while making no releases at all, so a
# tag-triggered release would publish the upstream's product under the
# upstream's identity. Those five workflows were deleted rather than disabled.
# Do not reintroduce signing, publishing or release steps without an explicit
# decision about this fork's distribution model.

name: CI (Windows, unsigned)

on:
  push:
    branches:
      - main
      - 'wip/**'
  pull_request:
  workflow_dispatch:
    inputs:
      native_trash:
        description: 'Run the real Recycle Bin test on a disposable runner fixture'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build unsigned app
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend regressions
        run: npm test -- --maxWorkers=2

      - name: Translation and rule contracts
        run: npm run test:release-contracts

      # The real Shell/bin test is ignored by default and separately opt-in.
      - name: Backend regressions
        working-directory: src-tauri
        run: cargo test --lib --locked --jobs 2 -- --test-threads=2

      # --no-bundle builds the executable without producing installers.
      - name: Build app executable, unsigned
        run: npm run tauri build -- --no-bundle --ci -- --locked --jobs 2

      - name: Record unsigned executable provenance
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $executable = Get-Item -LiteralPath 'src-tauri/target/release/mouzi.exe'
          $hash = Get-FileHash -LiteralPath $executable.FullName -Algorithm SHA256
          Write-Host "Git commit: $(git rev-parse --verify HEAD)"
          Write-Host "Runner: $env:RUNNER_OS $env:RUNNER_ARCH ($env:ImageOS $env:ImageVersion)"
          Write-Host "Node: $(node --version)"
          Write-Host "npm: $(npm --version)"
          rustc --version --verbose
          cargo --version
          Write-Host "Executable: src-tauri/target/release/mouzi.exe ($($executable.Length) bytes)"
          Write-Host "Executable SHA-256: $($hash.Hash)"

  native-trash:
    name: Explicit Windows Recycle Bin integration
    if: github.event_name == 'workflow_dispatch' && inputs.native_trash
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - name: Test only the disposable native-bin fixture
        working-directory: src-tauri
        run: cargo test --lib --locked --jobs 2 safe_fs::tests::delete_to_trash_places_the_file_in_the_recycle_bin -- --ignored --exact --test-threads=1
